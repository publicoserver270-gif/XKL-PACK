name: Build XKL PACK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compilar e empacotar
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Publicar JAR como artefato
        uses: actions/upload-artifact@v4
        with:
          name: xkl-pack
          path: target/*.jar
          if-no-files-found: error
