# XKL PACK - configuração inicial
settings:
  language: pt-BR
  storage: sqlite

database:
  sqlite-file: data/xklpack.db

modules:
  economy: true
  bank: false
  jobs: false
  shops: false
  selling: false
  rankings: true

economy:
  currencies:
    coins:
      display-name: Coins
      symbol: "$"
      decimals: 2
      transfers-enabled: true
    gems:
      display-name: Gemas
      symbol: "◆"
      decimals: 0
      transfers-enabled: true

# REGRAS DE EMISSÃO:
# - Coins: somente o sistema de salário pode emitir.
# - Gemas: somente atividades de profissões podem emitir.
# - Gemas só podem ser gastas em ferramentas.
# - Não existe conversão automática entre moedas.
