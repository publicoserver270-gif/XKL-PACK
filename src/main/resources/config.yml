# XKL PACK - configuração inicial
settings:
  language: pt-BR
  storage: sqlite

database:
  sqlite-file: data/xklpack.db

modules:
  economy: true
  bank: true
  jobs: true
  shops: false
  selling: false
  rankings: true

economy:
  currencies:
    coins:
      display-name: Coins
      symbol: "$"
      decimals: 2
      transfers-enabled: true
    gems:
      display-name: Gemas
      symbol: "◆"
      decimals: 0
      transfers-enabled: true

# PROFISSÕES
# Gemas são emitidas somente por atividade profissional.
# Coins são emitidas por salários de metas profissionais e vendas confirmadas em /sell.
jobs:
  max-level: 140
  leveling:
    base-xp: 100
    xp-per-level: 25
  gems:
    every-xp: 100
    amount: 1
  activity-xp:
    minerador: 5
    lenhador: 3
    fazendeiro: 2
    cacador: 4
    pescador: 5
  professions:
    minerador:
      name: Minerador
      description: Extraia minérios e recursos subterrâneos.
    lenhador:
      name: Lenhador
      description: Colete madeira de árvores.
    fazendeiro:
      name: Fazendeiro
      description: Colha plantações maduras.
    cacador:
      name: Caçador
      description: Cace criaturas hostis e animais.
    pescador:
      name: Pescador
      description: Pesque peixes e tesouros.

# REGRAS DE EMISSÃO:
# - Coins: somente salário profissional e venda confirmada em /sell podem emitir.
# - Gemas: somente atividades de profissões podem emitir.
# - Gemas só podem ser gastas em ferramentas.
# - Não existe conversão automática entre moedas.
