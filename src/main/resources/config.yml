config-version: 5

# XKL PACK - configuração principal
settings:
  language: pt-BR
  storage: sqlite

database:
  sqlite-file: data/xklpack.db

modules:
  economy: true
  bank: true
  jobs: true
  shops: true
  selling: true
  admin-panel: true
  wallet: true
  rankings: true

economy:
  currencies:
    coins:
      display-name: Coins
      symbol: "$"
      decimals: 2
      transfers-enabled: true
    gems:
      display-name: Gemas
      symbol: "◆"
      decimals: 0
      # Gemas não podem ser transferidas: são pessoais e exclusivas para ferramentas.
      transfers-enabled: false

# PROFISSÕES
# Uma profissão ativa por jogador. O progresso de cada profissão fica salvo separadamente.
jobs:
  max-level: 500

  # Kits vinculados à profissão. A ferramenta evolui automaticamente nos níveis configurados.
  # Todas as ferramentas dos kits são indestrutíveis e não perdem durabilidade.
  kits:
    enabled: true
    professions:
      minerador:
        display-name: "&6Picareta do Minerador"
        tiers:
          1: {material: WOODEN_PICKAXE}
          11: {material: STONE_PICKAXE, enchantments: {efficiency: 1}}
          26: {material: IRON_PICKAXE, enchantments: {efficiency: 2, unbreaking: 1}}
          51: {material: GOLDEN_PICKAXE, enchantments: {efficiency: 3, unbreaking: 1}}
          101: {material: DIAMOND_PICKAXE, enchantments: {efficiency: 4, unbreaking: 2}}
          160: {material: DIAMOND_PICKAXE, enchantments: {efficiency: 5, unbreaking: 3}}
      lenhador:
        display-name: "&6Machado do Lenhador"
        tiers:
          1: {material: WOODEN_AXE}
          5: {material: STONE_AXE, enchantments: {efficiency: 1}}
          10: {material: IRON_AXE, enchantments: {efficiency: 2, unbreaking: 1}}
          20: {material: GOLDEN_AXE, enchantments: {efficiency: 3, unbreaking: 1}}
          40: {material: DIAMOND_AXE, enchantments: {efficiency: 4, unbreaking: 2}}
          80: {material: NETHERITE_AXE, enchantments: {efficiency: 5, unbreaking: 3}}
          160: {material: NETHERITE_AXE, enchantments: {efficiency: 6, unbreaking: 3}}
      fazendeiro:
        display-name: "&aEnxada do Fazendeiro"
        tiers:
          1: {material: WOODEN_HOE}
          5: {material: STONE_HOE, enchantments: {efficiency: 1}}
          10: {material: IRON_HOE, enchantments: {efficiency: 2, unbreaking: 1}}
          20: {material: GOLDEN_HOE, enchantments: {efficiency: 3, unbreaking: 1}}
          40: {material: DIAMOND_HOE, enchantments: {efficiency: 4, unbreaking: 2}}
          80: {material: NETHERITE_HOE, enchantments: {efficiency: 5, unbreaking: 3}}
          160: {material: NETHERITE_HOE, enchantments: {efficiency: 6, unbreaking: 3}}
      cacador:
        display-name: "&cEspada do Caçador"
        tiers:
          1: {material: WOODEN_SWORD}
          5: {material: STONE_SWORD, enchantments: {sharpness: 1}}
          10: {material: IRON_SWORD, enchantments: {sharpness: 2, unbreaking: 1}}
          20: {material: GOLDEN_SWORD, enchantments: {sharpness: 3, unbreaking: 1}}
          40: {material: DIAMOND_SWORD, enchantments: {sharpness: 4, unbreaking: 2}}
          80: {material: NETHERITE_SWORD, enchantments: {sharpness: 5, unbreaking: 3}}
          160: {material: NETHERITE_SWORD, enchantments: {sharpness: 6, unbreaking: 3}}
      pescador:
        display-name: "&bVara do Pescador"
        tiers:
          1: {material: FISHING_ROD}
          5: {material: FISHING_ROD, enchantments: {luck_of_the_sea: 1, lure: 1}}
          10: {material: FISHING_ROD, enchantments: {luck_of_the_sea: 2, lure: 2, unbreaking: 1}}
          20: {material: FISHING_ROD, enchantments: {luck_of_the_sea: 3, lure: 3, unbreaking: 1}}
          40: {material: FISHING_ROD, enchantments: {luck_of_the_sea: 4, lure: 4, unbreaking: 2}}
          80: {material: FISHING_ROD, enchantments: {luck_of_the_sea: 5, lure: 5, unbreaking: 3}}
          160: {material: FISHING_ROD, enchantments: {luck_of_the_sea: 6, lure: 6, unbreaking: 3}}

  leveling:
    # XP próprio do XKL PACK; não usa a barra de XP vanilla.
    base-xp: 100
    xp-per-level: 25
    # Marcos de progressão para kits/equipamentos profissionais.
    tiers:
      madeira: {min-level: 1, max-level: 4}
      pedra: {min-level: 5, max-level: 19}
      ferro: {min-level: 20, max-level: 39}
      ouro: {min-level: 40, max-level: 79}
      diamante: {min-level: 80, max-level: 159}
      netherita: {min-level: 160, max-level: 500}

  # A cada 100 XP profissional acumulado, recebe 1 gema.
  # Ajuste os valores sem alterar o código.
  gems:
    every-xp: 100
    amount: 1

  # XP por atividade; mineração usa os valores de raridade abaixo.
  activity-xp:
    minerador: 5
    lenhador: 3
    fazendeiro: 2
    cacador: 4
    pescador: 5

  mining-xp:
    common: 3
    uncommon: 5
    rare: 10
    epic: 20

  # Cada atividade elegível conta como 1 unidade de produção para a meta.
  # A meta e o salário crescem permanentemente por profissão.
  salary:
    production-goal: 100
    goal-increase-per-cycle: 25
    base-reward: 500.0
    multiplier-start: 1.3
    multiplier-every-goals: 40
    multiplier-increase-every-40-goals: 0.1

  professions:
    minerador:
      max-level: 200
      name: Minerador
      description: Extraia minérios e recursos subterrâneos.
    lenhador:
      max-level: 200
      name: Lenhador
      description: Colete madeira de árvores.
    fazendeiro:
      max-level: 500
      name: Fazendeiro
      description: Colha plantações maduras.
    cacador:
      max-level: 200
      name: Caçador
      description: Cace criaturas e obtenha experiência de caça.
    pescador:
      max-level: 200
      name: Pescador
      description: Pesque peixes e tesouros.

# REGRAS DE EMISSÃO (fontes autorizadas):
# - Coins: salários por metas de produção profissional e vendas confirmadas em /sell.
# - Gemas: atividades profissionais elegíveis, calculadas pelo XP próprio acumulado.
# - Gemas não podem ser transferidas nem convertidas; só podem comprar ferramentas.
# - /pay apenas transfere saldo já existente; não cria moeda.
# - Não existe conversão automática entre Coins e Gemas.

# Limites iniciais editáveis para ferramentas especiais.
# O nível de referência atual é o da profissão ativa; os valores são pontos de partida.
equipment-limits:
  enabled: true
  level-source: active-profession
  owned-slots:
    1: 1
    5: 2
    10: 3
    20: 4
    30: 5
  equipped-slots:
    1: 1
    5: 2
    10: 3
    20: 4
    30: 5
