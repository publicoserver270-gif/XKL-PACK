name: XKL-PACK
version: 0.2.0-SNAPSHOT
main: br.com.xklpack.XKLPack
api-version: '1.21'
authors: [XKL]
description: Plugin modular de economia, banco e profissões.
website: https://github.com/publicoserver270-gif/XKL-PACK
commands:
  pay:
    description: Transfere saldo virtual para outro jogador.
    usage: /pay <jogador> <valor> [moeda]
  top:
    description: Mostra o ranking de saldos.
    usage: /top [online] [coins|gems]
permissions:
  xklpack.command.pay:
    description: Permite usar /pay.
    default: true
  xklpack.command.top:
    description: Permite consultar rankings.
    default: true
